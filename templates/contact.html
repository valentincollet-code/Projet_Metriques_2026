<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Spatial — Ultra Design</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* --- 1. BASE ET FOND ANIME (Inchangé) --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            padding: 20px;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- 2. LA CARTE (Inchangée) --- */
        .contact-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 50px 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            color: #ffffff;
            position: relative;
            overflow: hidden; /* Important pour les effets de lumière */
        }

        .contact-card h2 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.5em;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(255,255,255,0.3);
        }

        /* --- 3. LES CHAMPS ULTRA ORIGINAUX (Style "Ligne Pure" + Glow) --- */
        .input-group {
            position: relative;
            margin-bottom: 35px;
        }

        /* Le label flotte au-dessus de la ligne */
        .input-group label {
            position: absolute;
            top: 10px;
            left: 0;
            color: rgba(255, 255, 255, 0.6);
            pointer-events: none;
            transition: all 0.3s ease;
            font-size: 1em;
        }

        /* L'input lui-même n'est qu'une ligne transparente */
        .input-group input, 
        .input-group textarea {
            width: 100%;
            padding: 10px 0;
            border: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2); /* Juste une ligne du bas */
            background: transparent;
            color: #fff;
            outline: none;
            font-size: 1.1em;
            transition: all 0.3s ease;
        }

        /* Le textarea a une zone de texte un peu plus grande */
        .input-group textarea {
            resize: none;
            height: 100px;
        }

        /* Animation quand on clique (focus) ou quand le champ est rempli */
        .input-group input:focus ~ label,
        .input-group input:valid ~ label,
        .input-group textarea:focus ~ label,
        .input-group textarea:valid ~ label {
            top: -20px; /* Le label monte */
            font-size: 0.8em;
            color: #fff;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* L'effet de "ligne lumineuse" au focus */
        .input-group input:focus, 
        .input-group textarea:focus {
            border-bottom: 2px solid #fff;
            box-shadow: 0 5px 15px rgba(255,255,255,0.2); /* Glow subtil vers le bas */
        }

        /* --- 4. LE BOUTON SUPER ORIGINAL (Néon Animé / Cyberpunk) --- */
        
        /* Conteneur pour positionner les bordures lumineuses */
        .btn-container {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        /* Le bouton réel */
        .ultra-btn {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            padding: 18px 30px;
            color: #fff;
            font-size: 1.2em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            border-radius: 5px; /* Forme un peu plus angulaire pour le look tech */
            position: relative;
            overflow: hidden; /* Pour l'effet de reflet au survol */
        }

        /* Effet de reflet rapide au survol du bouton */
        .ultra-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: 0.5s;
        }

        .ultra-btn:hover::before {
            left: 100%;
        }

        /* Hover simple : fond devient plus blanc */
        .ultra-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            color: #fff;
        }

        /* --- LES BORDURES ANIMEES ROTATIVES --- */
        /* C'est ce qui crée l'effet de cadre qui tourne autour du bouton */
        .btn-borders {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 5px;
            overflow: hidden;
            pointer-events: none; /* Ne pas bloquer le clic sur le bouton */
        }

        .btn-borders span {
            position: absolute;
            display: block;
        }

        /* Ligne du haut (gauche -> droite) */
        .btn-borders span:nth-child(1) {
            top: 0;
            left: -100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ffffff);
            animation: btn-anim1 1.5s linear infinite;
        }

        @keyframes btn-anim1 {
            0% { left: -100%; }
            50%,100% { left: 100%; }
        }

        /* Ligne de droite (haut -> bas) */
        .btn-borders span:nth-child(2) {
            top: -100%;
            right: 0;
            width: 2px;
            height: 100%;
            background: linear-gradient(180deg, transparent, #ffffff);
            animation: btn-anim2 1.5s linear infinite;
            animation-delay: 0.375s; /* 1/4 du temps d'animation */
        }

        @keyframes btn-anim2 {
            0% { top: -100%; }
            50%,100% { top: 100%; }
        }

        /* Ligne du bas (droite -> gauche) */
        .btn-borders span:nth-child(3) {
            bottom: 0;
            right: -100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(270deg, transparent, #ffffff);
            animation: btn-anim3 1.5s linear infinite;
            animation-delay: 0.75s; /* 2/4 du temps */
        }

        @keyframes btn-anim3 {
            0% { right: -100%; }
            50%,100% { right: 100%; }
        }

        /* Ligne de gauche (bas -> haut) */
        .btn-borders span:nth-child(4) {
            bottom: -100%;
            left: 0;
            width: 2px;
            height: 100%;
            background: linear-gradient(360deg, transparent, #ffffff);
            animation: btn-anim4 1.5s linear infinite;
            animation-delay: 1.125s; /* 3/4 du temps */
        }

        @keyframes btn-anim4 {
            0% { bottom: -100%; }
            50%,100% { bottom: 100%; }
        }
    </style>
</head>
<body>

    <div class="contact-card">
        <h2>Contact</h2>
        
        <form onsubmit="event.preventDefault(); alert('🚀 Design Validé ! Simulation d\'envoi réussie.');">
            
            <div class="input-group">
                <input type="text" id="nom" required>
                <label for="nom">Nom de Famille</label>
            </div>
            
            <div class="input-group">
                <input type="text" id="prenom" required>
                <label for="prenom">Prénom</label>
            </div>
            
            <div class="input-group">
                <textarea id="message" required></textarea>
                <label for="message">Saisissez votre message...</label>
            </div>
            
            <div class="btn-container">
                <button type="submit" class="ultra-btn">Envoyer</button>
                <div class="btn-borders">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </form>
    </div>

</body>
</html>
